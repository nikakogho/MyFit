<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyFit scratch outfit</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111;
        color: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      main {
        width: min(100%, 760px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.25rem, 5vw, 2rem);
      }

      p {
        margin: 0 0 16px;
        color: #bdbdbd;
        line-height: 1.5;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: #222;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mostly-white casual outfit</h1>
      <p>Exact MyFit wardrobe garments and original colourways.</p>
      <img
        src="./mostly-white-casual-exact-wardrobe.png"
        alt="Mostly-white casual outfit using the white snap-collar high-neck top, dark navy tactical cargo trousers, and cream-and-brown paneled sneakers"
        width="1024"
        height="1536"
      />
    </main>
  </body>
</html>
